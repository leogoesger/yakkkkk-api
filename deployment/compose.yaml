services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates
      - caddy_config:/config
    depends_on:
      - proxy

  # The Go app. No ports: only reachable from Caddy on the internal network.
  proxy:
    image: ${PROXY_IMAGE:?set PROXY_IMAGE in .env}
    restart: unless-stopped
    env_file: proxy.env # app settings and secrets; see proxy.env.example

volumes:
  caddy_data:
  caddy_config:

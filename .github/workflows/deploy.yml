name: Deploy

on:
  push:
    branches: [main]
    paths: ["app/**", "deployment/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (rollback), e.g. sha-1a2b3c4. Empty: build the current commit."
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          build-args: VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Runs after a build, or on its own for a rollback.
    if: ${{ always() && (needs.build.result == 'success' || inputs.tag) }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DOMAIN: ${{ vars.DOMAIN || 'api.yakkkkk.com' }}
          PROXY_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.tag || needs.build.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deployment/deploy.sh
